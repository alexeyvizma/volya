anti:{n:'Календарь привычек',i:'📅',s:'Дни свободы и калькулятор экономии',h:()=>`<p>Отмечай, с какого дня держишься, и смотри, сколько дней и денег уже сохранено.</p><div id='an'></div><input type='text' id='what' placeholder='От чего освобождаешься? Например, сигареты'><input type='text' id='cost' inputmode='decimal' placeholder='Сколько тратил в день'><div class='chips' id='cu' style='margin:0 0 12px'>${['грн','руб','€','$'].map(x=>`<button class='chip'>${x}</button>`).join('')}</div><input type='date' id='sd'><button class='btn' id='sv'>Сохранить</button><button class='btn g' id='rs' style='margin-top:10px'>Начать отсчёт с сегодня</button><button class='btn g' id='rz' style='margin-top:10px;color:#ff453a'>Сбросить всё</button><p class='src'>Срыв — не конец пути: просто начни отсчёт снова. Данные хранятся только на твоём телефоне.</p>`,f:()=>{const K='volya_anti',MS=[1,3,7,14,30,60,90,180,365];let d={};try{d=JSON.parse(localStorage.getItem(K)||'{}')}catch(e){}

const cur=d.cur||'€',days=Math.max(0,Math.floor((Date.now()-new Date(d.start+'T00:00:00'))/864e5)),nx=MS.find(m=>m>days)||days+1,pv=MS.filter(m=>m<=days).pop()||0,C=2*Math.PI*80,money=Math.round(days*(parseFloat(d.cost)||0));
