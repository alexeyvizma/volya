*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}

@keyframes eb{0%,100%{transform:translateY(0)}40%{transform:translateY(-.22em) scale(1.1)}}

.fi{width:100%;box-sizing:border-box;padding:14px 16px;border-radius:14px;border:1px solid rgba(128,128,128,.3);background:var(--chip);color:var(--tx);font:inherit;font-size:17px;margin:6px 0 12px}

</style>

><p style="margin:0 0 10px;color:var(--tx);font-size:22px;font-weight:700;line-height:1.2">6 лет чистоты. Каждый день. Ни одного срыва 🔥</p><p style="margin:0 0 10px">Бег 🏃 велик 🚴 калистеника 🤸 Тело, которое я чуть не угробил, теперь работает на меня:<br>🏃 1000 дней бега подряд, ни одного пропуска<br>🚴 500 км на велике: <svg class="fl" viewBox="0 0 9 6"><rect width="9" height="2" fill="#AE1C28"/><rect y="2" width="9" height="2" fill="#fff"/><rect y="4" width="9" height="2" fill="#21468B"/></svg> Нидерланды → <svg class="fl" viewBox="0 0 3 2"><rect width="1" height="2" fill="#000"/><rect x="1" width="1" height="2" fill="#FAE042"/><rect x="2" width="1" height="2" fill="#ED2939"/></svg> Бельгия<br>🚴 1000 км: <svg class="fl" viewBox="0 0 3 2"><rect width="1" height="2" fill="#009246"/><rect x="1" width="1" height="2" fill="#fff"/><rect x="2" width="1" height="2" fill="#CE2B37"/></svg> Италия → <svg class="fl" viewBox="0 0 32 32" style="width:15px"><rect width="32" height="32" fill="#D52B1E"/><path d="M13 6h6v7h7v6h-7v7h-6v-7H6v-6h7z" fill="#fff"/></svg> Швейцария<br>🏅 Half Ironman за 6 часов<br>🪨 30 км бегом с камнем 23 кг<br>🧬 Биологически стал моложе на 10 лет<br>📊 Все маркеры: я в 1% по выносливости<br>…и всё это благодаря методу замены 🔁</p><p style="margin:0 0 10px;color:var(--tx);font-size:22px;font-weight:700;line-height:1.2">Из зависимого овоща я стал зверем 🦁</p><p style="margin:0 0 10px">5 книг 📚 сертификат США, Стэнфорд 🎓 Но главный диплом — выжить и не соврать себе.</p><p style="margin:0;color:var(--tx);font-size:22px;font-weight:700;line-height:1.2">Я не гуру. Я — доказательство, что выбраться реально 😎</p></div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px">${[['100+','человек переписали сценарий'],['3','видео-сессии в программе «Сила Воли»'],['100%','анонимность']].map(s=>`<div class="card" style="margin:0;padding:14px;text-align:center"><div data-n="${parseInt(s[0])}" data-s="${s[0].replace(/[0-9]/g,'')}" style="font-size:26px;font-weight:700;color:var(--bl)">${s[0]}</div><div class="small">${s[1]}</div></div>`).join('')}</div><div class="card"><h3>Знакомый сюжет? 🎬</h3><p style="margin:0">Клянёшься «в последний раз» 🤞 → держишься три дня → стресс → срыв → злишься на себя → снова клянёшься. Сезон 47, серия 12 🍿</p></div><div class="card"><h3>Почему это повторяется</h3><p style="margin:0">Одного желания измениться мало. Пока непонятно, что запускает привычку и какую задачу она решает, сценарий возвращается.</p></div><div class="card"><h3>Программа «Сила Воли»</h3><p>Разбираем механизм срыва и ищем замену. Анонимно.</p><button class="btn" onclick="window.open(PAT,'_blank')">Смотреть программу</button></div><p style="text-align:center;font-size:20px;color:var(--tx);font-weight:600">«Если не сейчас — то когда?»</p>${tgCard()}<div class="card"><h3>Instagram</h3><p>Мой путь, спорт и выносливость.</p><button class="btn g" onclick="window.open('https://instagram.com/alexeyvizma','_blank')">@alexeyvizma</button></div></div>`;}
