"], "авторская книга «Зависимость побеждает зависимость»": ["авторська книга «Залежність перемагає залежність»", "the author’s book “Addiction Beats Addiction”"], "проверенные замены зависимостей на то, что даёт похожий эффект, но без вреда для организма": ["перевірені заміни залежностей на те, що дає схожий ефект, але без шкоди для організму", "proven swaps from addictions to things that give a similar effect without harming the body"], "Смотреть программу": ["Дивитися програму", "Watch the program"], "ЛИЧНО СО МНОЙ 🎯": ["ОСОБИСТО ЗІ МНОЮ 🎯", "PERSONALLY WITH ME 🎯"], "Калибровка: 7 дней вместе": ["Калібрування: 7 днів разом", "Calibration: 7 days together"], "Отдельный, более глубокий формат. Семь дней работаем вместе, онлайн или офлайн, по 1–3 часа в день, в зависимости от сложности зависимости.": ["Окремий, глибший формат. Сім днів працюємо разом, онлайн або офлайн, по 1–3 години на день, залежно від складності залежності.", "A separate, deeper format. We work together for seven days, online or in person, 1–3 hours a day, depending on how severe the addiction is."], "Нестандартный подход 🧪": ["Нестандартний підхід 🧪", "An unconventional approach 🧪"], "Никакого «просто потерпи» и шаблонов, которые ты уже проходил. Только самые новые инструменты, проверенные на практике:": ["Ніякого «просто потерпи» і шаблонів, які ти вже проходив. Тільки найновіші інструменти, перевірені на практиці:", "No “just hang in there” and none of the templates you’ve already tried. Only the newest tools, tested in practice:"], "Микотерапия.": ["Мікотерапія.", "Mycotherapy."], "Грибные адаптогены в поддержку организма": ["Грибні адаптогени для підтримки організму", "Mushroom adaptogens to support the body"], "КПТ.": ["КПТ.", "CBT."], "Перепрошиваем мысли, которые ведут к срыву": ["Перепрошиваємо думки, що ведуть до зриву", "Rewiring the thoughts that lead to a relapse"], "Нейробиология.": ["Нейробіологія.", "Neurobiology."], "Что творится в мозге в момент тяги и как её гасить": ["Що відбувається в мозку в момент потяги і як її гасити", "What happens in the brain during a craving and how to put it out"], "Спорт против зависимости.": ["Спорт проти залежності.", "Sport against addiction."], "Работаем не со следствием, а с корнем: укрепляем сердечно-сосудистую систему, МПК (VO₂max), усиливаем митохондрии, выносливость и силу": ["Працюємо не з наслідком, а з коренем: зміцнюємо серцево-судинну систему, МСК (VO₂max), посилюємо мітохондрії, витривалість і силу", "We work on the root, not the symptom: strengthening the cardiovascular system, VO₂max, boosting mitochondria, endurance and strength"], "Питание.": ["Харчування.", "Nutrition."], "Еда, которая стабилизирует состояние и снижает тягу": ["Їжа, яка стабілізує стан і знижує потяг", "Food that steadies your state and reduces cravings"], "Инкубация сновидений (Dream incubation).": ["Інкубація сновидінь (Dream incubation).", "Dream incubation."], "Намеренно создаём условия, чтобы новый ты, трезвый и свободный, появлялся во сне": ["Навмисно створюємо умови, щоб новий ти, тверезий і вільний, з’являвся у сні", "We deliberately set the conditions for a new you, sober and free, to appear in your dreams"], "Реконсолидация памяти (Memory reconsolidation).": ["Реконсолідація пам’яті (Memory reconsolidation).", "Memory reconsolidation."], "Вспоминается старая эмоционально заряженная вредная модель, и в неё вносится несовместимый опыт. Мы не давим старую память, а меняем её эмоциональное значение и даём ей новый смысл": ["Згадується стара емоційно заряджена шкідлива модель, і в неї вноситься несумісний досвід. Ми не придушуємо стару пам’ять, а змінюємо її емоційне значення і даємо їй новий сенс", "An old, emotionally charged harmful pattern is recalled, and an incompatible experience is introduced into it. We don’t suppress the old memory, we change its emotional meaning and give it a new one"], "После 7 дней: замена.": ["Після 7 днів: заміна.", "After 7 days: replacement."], "Зависимость не просто уходит. На её место встаёт полезная привычка, которая делает тебя сильнее: калистеника, бег, велосипед, что тебе по душе. Ты уходишь не с пустотой, а с новой опорой.": ["Залежність не просто йде. На її місце стає корисна звичка, яка робить тебе сильнішим: калістеніка, біг, велосипед, що тобі до душі. Ти йдеш не з порожнечею, а з новою опорою.", "The addiction doesn’t just leave. A useful habit takes its place and makes you stronger: calisthenics, running, cycling, whatever suits you. You leave not with a void but with a new support."], "Я был там.": ["Я був там.", "I’ve been there."], "До сих пор не встретил человека, который был зависим от стольких вещей, как я, и выбрался.": ["Досі не зустрів людини, яка була залежна від стількох речей, як я, і вибралася.", "I still haven’t met anyone who was addicted to as many things as I was and got out."], "Без «волшебной таблетки».": ["Без «чарівної пігулки».", "No “magic pill.”"], "Я не обещаю, что одно средство изменит судьбу. Но обещаю сделать всё, что смогу, чтобы отдать тебе весь свой опыт в зависимостях и ультраспорте, чтобы ты сэкономил(а) годы своей жизни. Мы рано или поздно понимаем, что всё зависело от нас.": ["Я не обіцяю, що один засіб змінить долю. Але обіцяю зробити все, що зможу, щоб віддати тобі весь свій досвід у залежностях і ультраспорті, щоб ти заощадив(ла) роки свого життя. Рано чи пізно ми розуміємо, що все залежало від нас.", "I don’t promise that one remedy will change your fate. But I promise to do everything I can to give you all my experience in addictions and ultra-sport so you save years of your life. Sooner or later we realize it all depended on us."], "За годы я перепробовал практически все варианты бросить и знаю, что работает, а что нет. Из этого я сформулировал точный взгляд на любую зависимость и на то, как с ней работать. Напиши в Telegram слово «калибровка», и я отвечу лично.": ["За роки я перепробував практично всі варіанти кинути і знаю, що працює, а що ні. З цього я сформулював точний погляд на будь-яку залежність і на те, як з нею працювати. Напиши в Telegram слово «калібрування», і я відповім особисто.", "Over the years I tried almost every way to quit, and I know what works and what doesn’t. From that I built a precise view of any addiction and how to work with it. Write the word “calibration” to me on Telegram and I’ll reply personally."], "Записаться на калибровку": ["Записатися на калібрування", "Sign up for calibration"], "Алексей Визьма": ["Олексій Візьма", "Alexey Vizma"], "Автор программы «Сила Воли»": ["Автор програми «Сила Волі»", "Author of the “Willpower” program"], "лет я был чемпионом по саморазрушению 🏆": ["років я був чемпіоном із саморуйнування 🏆", "years as a champion of self-destruction 🏆"], "Сигареты, алкоголь, наркотики, банкротство, предательство. Полный набор, как в плохом сериале 🎬 Мотивация «с понедельника» не спасла. Спасла замена 🔁": ["Сигарети, алкоголь, наркотики, банкрутство, зрада. Повний набір, як у поганому серіалі 🎬 Мотивація «з понеділка» не врятувала. Врятувала заміна 🔁", "Cigarettes, alcohol, drugs, bankruptcy, betrayal. The full set, like a bad TV series 🎬 “Starting Monday” motivation didn’t save me. Replacement did 🔁"], "Я не врач и не гуру. Я был там, где ты сейчас, и знаю дорогу оттуда 🤝": ["Я не лікар і не гуру. Я був там, де ти зараз, і знаю дорогу звідти 🤝", "I’m not a doctor and not a guru. I was where you are now, and I know the way out 🤝"], "15 лет": ["15 років", "15 years"], "Срывы, враньё себе и «последний раз» каждый понедельник 🙃": ["Зриви, брехня собі і «востаннє» щопонеділка 🙃", "Relapses, lying to myself, and “one last time” every Monday 🙃"], "5 раз «умер» изнутри": ["5 разів «помер» зсередини", "“Died” inside 5 times"], "И 5 раз встал. Каждый раз казалось, что хуже уже некуда 💔": ["І 5 разів піднявся. Щоразу здавалося, що гірше вже нікуди 💔", "And got up 5 times. Every time it felt like it couldn’t get worse 💔"], "Поворот": ["Поворот", "The turning point"], "Понял: бросить нельзя, но можно заменить вредное на полезное 🔁": ["Зрозумів: кинути не можна, але можна замінити шкідливе на корисне 🔁", "I realized: you can’t quit, but you can replace the harmful with the useful 🔁"], "6 лет чистоты": ["6 років чистоти", "6 years clean"], "Каждый день. Ни одного срыва 🔥": ["Щодня. Жодного зриву 🔥", "Every day. Not a single relapse 🔥"], "Сегодня из овоща в зверя": ["Сьогодні з овоча у звіра", "Today from a vegetable to a beast"], "Half Ironman за 6 часов 🏅": ["Half Ironman за 6 годин 🏅", "Half Ironman in 6 hours 🏅"], "500 км": ["500 км", "500 km"], "от Киева до Львова за 6 дней, один. Благотворительный забег для «Твоя Опора» 🏃": ["від Києва до Львова за 6 днів, сам. Благодійний забіг для «Твоя Опора» 🏃", "from Kyiv to Lviv in 6 days, alone. A charity run for “Tvoya Opora” (“Your Support”) 🏃"], "3 года бегал, потом 3 года каждый день ездил на велосипеде без единого пропуска, и всё в радость 😊": ["3 роки бігав, потім 3 роки щодня їздив на велосипеді без жодного пропуску, і все в радість 😊", "Ran for 3 years, then rode a bike every single day for 3 years without a miss, and loved every minute 😊"], "30 км бегом с камнем 23 кг 🪨": ["30 км бігом з каменем 23 кг 🪨", "30 km run carrying a 23 kg stone 🪨"], "10 часов медитации без ничего 🧘": ["10 годин медитації без нічого 🧘", "10 hours of meditation with nothing 🧘"], "7 дней голода 💪": ["7 днів голоду 💪", "7 days of fasting 💪"], "1000 км": ["1000 км", "1000 km"], "Я понимаю тебя 🫶": ["Я розумію тебе 🫶", "I understand you 🫶"], "Стыд перед близкими. Враньё «это в последний раз». Страх «а кто я без этого». Здесь тебя не осудят, и сильным быть не нужно, чтобы начать.": ["Сором перед близькими. Брехня «це востаннє». Страх «а хто я без цього». Тут тебе не осудять, і сильним бути не потрібно, щоб почати.", "Shame before loved ones. The lie “this is the last time.” The fear of “who am I without this.” Nobody will judge you here, and you don’t have to be strong to begin."], "Не только личный опыт 🎓": ["Не лише особистий досвід 🎓", "Not just personal experience 🎓"], "Я прошёл курс Stanford Center for Health Education «Psychology of Addiction and Recovery». Опыт плюс наука, а не что-то одно.": ["Я пройшов курс Stanford Center for Health Education «Psychology of Addiction and Recovery». Досвід плюс наука, а не щось одне.", "I completed the Stanford Center for Health Education course “Psychology of Addiction and Recovery.” Experience plus science, not just one of them."], "Написал 5 авторских книг": ["Написав 5 авторських книг", "Wrote 5 books of my own"], "про привычки и зависимости": ["про звички та залежності", "about habits and addictions"], "Мой путь, спорт и выносливость.": ["Мій шлях, спорт і витривалість.", "My journey, sport and endurance."], "Желание похоже на волну: нарастает, достигает пика и спадает — обычно за 10–20 минут. Не борись с ним, наблюдай.": ["Бажання схоже на хвилю: наростає, досягає піку і спадає — зазвичай за 10–20 хвилин. Не борися з ним, спостерігай.", "An urge is like a wave: it builds, peaks and fades, usually within 10–20 minutes. Don’t fight it, just watch."], "Готов?": ["Готовий?", "Ready?"], "Поехали, 10 минут 🌊": ["Поїхали, 10 хвилин 🌊", "Let’s go, 10 minutes 🌊"], "Поехали, 10 минут": ["Поїхали, 10 хвилин", "Let’s go, 10 minutes"], "Основа: Marlatt & Gordon, профилактика рецидивов; mindfulness-based relapse prevention.": ["Основа: Marlatt & Gordon, профілактика рецидивів; mindfulness-based relapse prevention.", "Basis: Marlatt & Gordon, relapse prevention; mindfulness-based relapse prevention."], "Часто тянет не к веществу, а к тому, чего не хватает. Отметь, что есть сейчас.": ["Часто тягне не до речовини, а до того, чого бракує. Познач, що є зараз.", "Often the pull isn’t toward the substance but toward what’s missing. Check what’s there right now."], "Голоден": ["Голодний", "Hungry"], "Злюсь": ["Злюся", "Angry"], "Одиноко": ["Самотньо", "Lonely"], "Устал": ["Втомився", "Tired"], "Отметь пункты — я подскажу первый шаг.": ["Познач пункти — я підкажу перший крок.", "Check the items and I’ll suggest a first step."], "Заранее решённая реакция срабатывает без борьбы силой воли. Формула: «Если случится X, то я сделаю Y».": ["Заздалегідь вирішена реакція спрацьовує без боротьби силою волі. Формула: «Якщо станеться X, то я зроблю Y».", "A reaction decided in advance works without a willpower fight. The formula: “If X happens, then I’ll do Y.”"], "Добавить план": ["Додати план", "Add a plan"], "Meta-analysis: Gollwitzer & Sheeran, 2006 — планы «если—то» заметно повышают достижение целей.": ["Meta-analysis: Gollwitzer & Sheeran, 2006 — плани «якщо—то» помітно підвищують досягнення цілей.", "Meta-analysis: Gollwitzer & Sheeran, 2006 — “if—then” plans noticeably improve goal attainment."], "Если я приду домой и захочу закурить…": ["Якщо я прийду додому і захочу закурити…", "If I come home and want a cigarette…"], "…то выпью воды и выйду на 10 минут": ["…то вип’ю води і вийду на 10 хвилин", "…then I’ll drink water and step outside for 10 minutes"], "Помогает при панике и сильном импульсе. Отмечай по мере выполнения.": ["Допомагає при паніці та сильному імпульсі. Відзначай у міру виконання.", "Helps with panic and strong urges. Check items off as you go."], "5 вещей, которые вижу": ["5 речей, які бачу", "5 things I can see"], "4 вещи, которых могу коснуться": ["4 речі, яких можу торкнутися", "4 things I can touch"], "3 звука, которые слышу": ["3 звуки, які чую", "3 sounds I can hear"], "2 запаха": ["2 запахи", "2 smells"], "1 вкус во рту": ["1 смак у роті", "1 taste in my mouth"], "Техника из КПТ для регуляции тревоги и внимания.": ["Техніка з КПТ для регуляції тривоги та уваги.", "A CBT technique for regulating anxiety and attention."], "Среда запускает привычку чаще, чем характер. Меняй то, что можно изменить.": ["Середовище запускає звичку частіше, ніж характер. Змінюй те, що можна змінити.", "Your environment triggers habits more often than your character does. Change what can be changed."], "Убрать триггер с глаз: спрятать, удалить, не покупать": ["Прибрати тригер з очей: сховати, видалити, не купувати", "Get the trigger out of sight: hide it, delete it, don’t buy it"], "Добавить трение: чтобы дотянуться, нужно 20+ секунд": ["Додати тертя: щоб дотягнутися, потрібно 20+ секунд", "Add friction: it should take 20+ seconds to reach"], "Сменить маршрут или место, где обычно срываешься": ["Змінити маршрут або місце, де зазвичай зриваєшся", "Change the route or the place where you usually slip"], "Найти союзника и сказать ему о цели": ["Знайти союзника і сказати йому про ціль", "Find an ally and tell them your goal"], "Если уйти нельзя — составить план «Если — то» на это место": ["Якщо піти не можна — скласти план «Якщо — то» на це місце", "If you can’t leave, make an “If — then” plan for that place"], "Wood & Neal, 2007: привычки в большой степени управляются контекстом.": ["Wood & Neal, 2007: звички значною мірою керуються контекстом.", "Wood & Neal, 2007: habits are largely driven by context."], "Отмечай, с какого дня держишься, и смотри, сколько дней и денег уже сохранено.": ["Відзначай, з якого дня тримаєшся, і дивись, скільки днів і грошей уже збережено.", "Mark the day you started holding on and see how many days and how much money you’ve saved."], "Укажи дату начала и сколько тратил в день, и я покажу прогресс.": ["Вкажи дату початку і скільки витрачав на день, і я покажу прогрес.", "Enter your start date and how much you spent per day, and I’ll show your progress."], "Сохранить": ["Зберегти", "Save"], "Начать отсчёт с сегодня": ["Почати відлік із сьогодні", "Start counting from today"], "Сбросить всё": ["Скинути все", "Reset everything"], "Срыв — не конец пути: просто начни отсчёт снова. Данные хранятся только на твоём телефоне.": ["Зрив — не кінець шляху: просто почни відлік знову. Дані зберігаються лише на твоєму телефоні.", "A relapse isn’t the end of the road: just start counting again. Your data stays only on your phone."], "От чего освобождаешься? Например, сигареты": ["Від чого звільняєшся? Наприклад, цигарки", "What are you freeing yourself from? For example, cigarettes"], "Сколько тратил в день": ["Скільки витрачав на день", "How much you spent per day"], "Десенсибилизация и переработка движением глаз. Подходит прямо в момент тяги: когда накрыло и хочется сорваться, открой этот инструмент и запусти точку. Держи тягу в мыслях и одновременно води глазами за точкой из стороны в сторону. Голову не двигай. Это занимает рабочую память, и переживание становится менее ярким.": ["Десенсибілізація та переробка рухами очей. Підходить просто в момент потягу: коли накрило і хочеться зірватися, відкрий цей інструмент і запусти точку. Тримай потяг у думках і водночас води очима за точкою з боку в бік. Голову не рухай. Це займає робочу пам’ять, і переживання стає менш яскравим.", "Eye Movement Desensitization and Reprocessing. It works right in the moment of craving: when it hits and you want to slip, open this tool and start the dot. Hold the craving in mind while moving your eyes side to side, following the dot. Don’t move your head. This occupies working memory, and the experience becomes less vivid."], "Насколько сильно сейчас:": ["Наскільки сильно зараз:", "How strong is it now:"], "из 10": ["з 10", "out of 10"], "Медленно": ["Повільно", "Slow"], "Средне": ["Середньо", "Medium"], "Быстро": ["Швидко", "Fast"], "Начать на 30 секунд": ["Почати на 30 секунд", "Start for 30 seconds"], "Самопомощь, не терапия. При тяжёлых травматических воспоминаниях делай ДПДГ только со специалистом. Если стало хуже, остановись и сделай «Заземление 5-4-3-2-1». Основа: метод EMDR (Shapiro); небольшие исследования (Littel, van den Hout & Engelhard, 2016) показывают, что движения глаз снижают яркость образов и тягу.": ["Самодопомога, не терапія. При важких травматичних спогадах роби ДПДГ лише зі спеціалістом. Якщо стало гірше, зупинись і зроби «Заземлення 5-4-3-2-1». Основа: метод EMDR (Shapiro); невеликі дослідження (Littel, van den Hout & Engelhard, 2016) показують, що рухи очей знижують яскравість образів і потяг.", "Self-help, not therapy. With heavy traumatic memories, do EMDR only with a specialist. If it gets worse, stop and do “Grounding 5-4-3-2-1.” Basis: the EMDR method (Shapiro); small studies (Littel, van den Hout & Engelhard, 2016) show that eye movements reduce the vividness of images and cravings."], "Пять шагов, которые можно сделать за 5 минут.": ["П’ять кроків, які можна зробити за 5 хвилин.", "Five steps you can do in 5 minutes."], "Чёрно-белый экран: Настройки → Универсальный доступ": ["Чорно-білий екран: Налаштування → Універсальний доступ", "Grayscale screen: Settings → Accessibility"], "Убрать соцсети с главного экрана": ["Прибрати соцмережі з головного екрана", "Remove social media from your home screen"], "Отключить все уведомления, кроме звонков": ["Вимкнути всі сповіщення, крім дзвінків", "Turn off all notifications except calls"], "Ночью телефон заряжается вне спальни": ["Вночі телефон заряджається поза спальнею", "Charge your phone outside the bedroom at night"], "Лимит приложений: 30 минут в день для самого затягивающего": ["Ліміт застосунків: 30 хвилин на день для найзатягнішого", "App limit: 30 minutes a day for the most addictive one"], "Исследования показывают, что даже присутствие телефона на столе снижает концентрацию (Ward et al., 2017).": ["Дослідження показують, що навіть присутність телефона на столі знижує концентрацію (Ward et al., 2017).", "Research shows that even having a phone on the table reduces concentration (Ward et al., 2017)."], "Вдох": ["Вдих", "Inhale"], "Выдох": ["Видих", "Exhale"], "Волна прошла": ["Хвиля минула", "The wave has passed"], "Ещё раз": ["Ще раз", "Once more"], "Поешь: белок и вода, 15 минут.": ["Поїж: білок і вода, 15 хвилин.", "Eat: protein and water, 15 minutes."], "Выпусти злость телом: 20 приседаний или быстрая ходьба.": ["Випусти злість тілом: 20 присідань або швидка ходьба.", "Release the anger through the body: 20 squats or brisk walking."], "Напиши или позвони одному человеку. Хватит одного сообщения.": ["Напиши або подзвони одній людині. Достатньо одного повідомлення.", "Write or call one person. One message is enough."], "Отдых 20 минут: лечь, без экрана. Решения вечером хуже.": ["Відпочинок 20 хвилин: лягти, без екрана. Рішення ввечері гірші.", "Rest for 20 minutes: lie down, no screen. Evening decisions are worse."], "дней без: ": ["днів без: ", "days without: "], "дней": ["днів", "days"], "Точно сбросить? Нажми ещё раз": ["Точно скинути? Натисни ще раз", "Really reset? Tap once more"], "Ещё подход": ["Ще підхід", "One more round"], "Было ": ["Було ", "Was "], ", стало ": [", стало ", ", now "], "Интенсивность снизилась. Можно сделать ещё подход.": ["Інтенсивність знизилась. Можна зробити ще підхід.", "The intensity went down. You can do another round."], "Без изменений. Попробуй ещё подход или другую скорость.": ["Без змін. Спробуй ще підхід або іншу швидкість.", "No change. Try another round or a different speed."], "Стало сильнее. Остановись и сделай заземление 5-4-3-2-1.": ["Стало сильніше. Зупинись і зроби заземлення 5-4-3-2-1.", "It got stronger. Stop and do grounding 5-4-3-2-1."], "Подход завершён": ["Підхід завершено", "Round complete"], "Выдохни. Оцени силу сейчас: подвинь ползунок выше. Было ": ["Видихни. Оціни силу зараз: пересунь повзунок вище. Було ", "Breathe out. Rate the intensity now: move the slider up. It was "], " из 10.": [" з 10.", " out of 10."]},RES=[["Твой портрет 🧬", "Твій портрет 🧬", "Your portrait 🧬"], ["Главное", "Головне", "The main thing"], ["Ты выбрал: ", "Ти обрав: ", "You chose: "], ["Портрет зависимости 🧬", "Портрет залежності 🧬", "Addiction portrait 🧬"], ["Контакт", "Контакт", "Contact"], ["Главный враг", "Головний ворог", "Main enemy"], ["Стаж", "Стаж", "How long"], ["Объём", "Обсяг", "Amount"], ["Частота", "Частота", "Frequency"], ["Триггеры", "Тригери", "Triggers"], ["Среда", "Середовище", "Environment"], ["Цена", "Ціна", "Cost"], ["Попытки", "Спроби", "Attempts"], ["Форма", "Форма", "Fitness level"], ["Параметры", "Параметри", "Parameters"], ["Пробовал", "Пробував", "Tried"], ["Комментарий", "Коментар", "Comment"], [" лет", " років", " years"], [" кг", " кг", " kg"], [" см", " см", " cm"], ["Формула замены 🔁", "Формула заміни 🔁", "Replacement formula 🔁"], ["Бросить не получится. Привычка решает задачу, и мы даём ей другое решение.", "Кинути не вийде. Звичка розв’язує завдання, і ми даємо їй інше рішення.", "You can’t just quit. A habit solves a task, so we give it a different solution."], ["→ хочется ", "→ хочеться ", "→ you want to "], ["Было: ", "Було: ", "Before: "], ["Станет: ", "Стане: ", "After: "], ["добыть эмоции и события", "здобути емоції та події", "get emotions and events"], ["сбросить напряжение", "скинути напругу", "release tension"], ["быстро взбодриться", "швидко збадьоритися", "perk up fast"], ["почувствовать контакт", "відчути контакт", "feel connected"], ["быть своим", "бути своїм", "belong"], ["заглушить злость", "заглушити злість", "drown out anger"], ["выдохнуть после дня", "видихнути після дня", "unwind after the day"], ["включиться в день", "увімкнутися в день", "switch on for the day"], ["выдохнуть", "видихнути", "unwind"], ["Накрыло", "Накрило", "It hits"], ["Программа замены 💪", "Програма заміни 💪", "Replacement program 💪"], ["Старт: ", "Старт: ", "Start: "], [" вместо ", " замість ", " instead of "], ["привычку", "звичку", "the habit"], ["Белка ориентир: около ", "Білка орієнтир: близько ", "Protein target: about "], [" г в день. Сон 7–8 часов: мышцы растут во сне.", " г на день. Сон 7–8 годин: м’язи ростуть уві сні.", " g a day. Sleep 7–8 hours: muscles grow during sleep."], ["Каждую неделю +1–2 повтора или +5 минут. Не перепрыгивай ступеньки.", "Щотижня +1–2 повтори або +5 хвилин. Не перестрибуй сходинки.", "Each week add 1–2 reps or 5 minutes. Don’t skip steps."], ["Запасные варианты: ", "Запасні варіанти: ", "Backup options: "], ["При болях или проблемах со здоровьем сначала к врачу.", "За болю або проблем зі здоров’ям спершу до лікаря.", "If you have pain or health problems, see a doctor first."], ["Почему это держится", "Чому це тримається", "Why it sticks"], ["Что запускает тягу", "Що запускає потяг", "What triggers the craving"], ["Не отмечено. Начни с наблюдения.", "Не відзначено. Почни зі спостереження.", "Nothing selected. Start by observing."], ["Шаг на сегодня", "Крок на сьогодні", "Today’s step"], ["План на 7 дней", "План на 7 днів", "7-day plan"], ["Ты написал", "Ти написав", "You wrote"], ["Инструменты для тебя", "Інструменти для тебе", "Tools for you"], ["Спасибо!", "Дякую!", "Thank you!"], ["Анкета готова. Нажми кнопку, и она откроется в Telegram у меня в личных сообщениях. Останется только нажать «Отправить», и я отвечу лично.", "Анкета готова. Натисни кнопку, і вона відкриється в Telegram у мене в особистих повідомленнях. Залишиться лише натиснути «Надіслати», і я відповім особисто.", "Your questionnaire is ready. Tap the button and it will open in my private messages on Telegram. Just press “Send” and I’ll reply personally."], ["Отправить мне в Telegram 📩", "Надіслати мені в Telegram 📩", "Send it to me on Telegram 📩"], ["Посмотреть свой портрет 🧬", "Подивитися свій портрет 🧬", "See your portrait 🧬"], ["20 отжиманий или подход подтягиваний", "20 віджимань або підхід підтягувань", "20 push-ups or a set of pull-ups"], ["20 отжиманий или подход подтягиваний", "20 віджимань або підхід підтягувань", "20 push-ups or a set of pull-ups"], ["10 минут лёгкого бега", "10 хвилин легкого бігу", "10 minutes of easy running"], ["15 минут на велике", "15 хвилин на велосипеді", "15 minutes on a bike"], ["3 раунда боя с тенью", "3 раунди бою з тінню", "3 rounds of shadowboxing"], ["подход базовых упражнений", "підхід базових вправ", "a set of basic exercises"], ["10 минут растяжки", "10 хвилин розтяжки", "10 minutes of stretching"], ["20 минут музыки руками", "20 хвилин музики руками", "20 minutes of playing music"], ["10 минут скетча или текста", "10 хвилин начерку або тексту", "10 minutes of sketching or writing"], ["10 страниц книги", "10 сторінок книги", "10 pages of a book"], ["урок на 10 минут", "урок на 10 хвилин", "a 10-minute lesson"], ["60 секунд холодного душа", "60 секунд холодного душу", "60 seconds of a cold shower"], ["20 минут в воде или контрастный душ", "20 хвилин у воді або контрастний душ", "20 minutes in the water or a contrast shower"], ["5 минут дыхания или медитации", "5 хвилин дихання або медитації", "5 minutes of breathing or meditation"], ["подъём на 30 минут раньше и стакан воды", "підйом на 30 хвилин раніше і склянка води", "waking up 30 minutes earlier and a glass of water"], ["20 минут быстрой ходьбы", "20 хвилин швидкої ходьби", "20 minutes of brisk walking"], ["10 минут записей в дневник", "10 хвилин записів у щоденник", "10 minutes of journaling"], ["10 минут своего дела", "10 хвилин своєї справи", "10 minutes of your own thing"], ["Телефон даёт быструю награду без усилий, и рука тянется к нему при скуке и тревоге.", "Телефон дає швидку нагороду без зусиль, і рука тягнеться до нього при нудьзі й тривозі.", "The phone gives a quick reward with no effort, and your hand reaches for it when you’re bored or anxious."], ["Убери соцсети с главного экрана и включи чёрно-белый режим на вечер.", "Прибери соцмережі з головного екрана і ввімкни чорно-білий режим на вечір.", "Move social media off your home screen and switch on grayscale mode for the evening."], ["Одиночество переживается почти как физическая боль, и зависимое поведение часто его заглушает.", "Самотність переживається майже як фізичний біль, і залежна поведінка часто її заглушає.", "Loneliness is felt almost like physical pain, and addictive behavior often drowns it out."], ["Напиши одному живому человеку сегодня. Достаточно двух строк.", "Напиши одній живій людині сьогодні. Достатньо двох рядків.", "Message one real person today. Two lines are enough."], ["Еда успокаивает нервную систему, поэтому переедание часто про эмоции, а не про голод.", "Їжа заспокоює нервову систему, тому переїдання часто про емоції, а не про голод.", "Food calms the nervous system, so overeating is often about emotions, not hunger."], ["Перед едой спроси себя: я голоден или мне нужно что-то другое? Подожди 10 минут.", "Перед їжею спитай себе: я голодний чи мені потрібно щось інше? Зачекай 10 хвилин.", "Before eating, ask yourself: am I hungry or do I need something else? Wait 10 minutes."], ["Тянет не только за никотином, но и за ритуалом: перерыв, кофе, пауза после стресса.", "Тягне не лише за нікотином, а й за ритуалом: перерва, кава, пауза після стресу.", "The pull isn’t only for nicotine but for the ritual: a break, coffee, a pause after stress."], ["Подбери замену ритуалу на 5 минут: вода, прогулка, жвачка, растяжка.", "Підбери заміну ритуалу на 5 хвилин: вода, прогулянка, жуйка, розтяжка.", "Pick a 5-minute replacement for the ritual: water, a walk, gum, stretching."], ["Алкоголь быстро снимает напряжение, и мозг запоминает его как способ расслабиться.", "Алкоголь швидко знімає напругу, і мозок запам’ятовує його як спосіб розслабитися.", "Alcohol relieves tension fast, and the brain remembers it as a way to relax."], ["Заранее реши, чем заменишь вечерний бокал: чай, душ, прогулка, звонок.", "Заздалегідь вирішуй, чим замінити вечірній келих: чай, душ, прогулянка, дзвінок.", "Decide in advance what will replace the evening glass: tea, a shower, a walk, a call."], ["Вещества дают сильную награду, а тяга часто запускается местами, людьми и состояниями.", "Речовини дають сильну нагороду, а потяг часто запускається місцями, людьми і станами.", "Substances give a strong reward, and cravings are often triggered by places, people and states."], ["Не оставайся с тягой один: скажи о ней человеку, которому доверяешь, и подумай о встрече со специалистом.", "Не залишайся з потягом сам: скажи про нього людині, якій довіряєш, і подумай про зустріч зі спеціалістом.", "Don’t stay alone with the craving: tell someone you trust, and consider seeing a specialist. т, упор на заранее заготовленные реакции и поддержку людей рядом.", "Ти змушений бути там, отже, акцент на заздалегідь заготовлені реакції та підтримку людей поруч.", "You have to be there, so focus on prepared reactions and the support of people nearby."], ["Присмотрись неделю, где и когда это происходит: записывай места и время.", "Придивись протягом тижня, де і коли це відбувається: записуй місця і час.", "Watch for a week where and when it happens: write down places and times."], ["День 1", "День 1", "Day 1"], ["День 2", "День 2", "Day 2"], ["День 3", "День 3", "Day 3"], ["День 4", "День 4", "Day 4"], ["День 5", "День 5", "Day 5"], ["День 6", "День 6", "Day 6"], ["День 7", "День 7", "Day 7"], ["Наблюдай. Записывай, когда тянет: время, место, что чувствовал.", "Спостерігай. Записуй, коли тягне: час, місце, що відчував.", "Observe. Write down when the craving hits: time, place, what you felt."], ["Первая замена: когда потянет — ", "Перша заміна: коли потягне — ", "First swap: when the urge hits, do "], [". Хоть 2 минуты, хоть криво.", ". Хоч 2 хвилини, хоч криво.", ". Even 2 minutes, even if it’s sloppy."], ["Перестрой среду: убери один триггер из поля зрения и положи на его место инвентарь замены.", "Перебудуй середовище: прибери один тригер з поля зору і поклади на його місце інвентар заміни.", "Rebuild your environment: take one trigger out of sight and put your replacement gear in its place."], ["Две схемы «Если — то»: если накрыло, то ", "Дві схеми «Якщо — то»: якщо накрило, то ", "Two “If — then” plans: if it hits, then "], [". Запиши их.", ". Запиши їх.", ". Write them down."], ["Скажи о цели одному человеку, которому доверяешь.", "Скажи про ціль одній людині, якій довіряєш.", "Tell one person you trust about your goal."], ["Накрыло — «Волна желания», потом замена. Переживи 10 минут.", "Накрило — «Хвиля бажання», потім заміна. Переживи 10 хвилин.", "It hits — “Urge wave,” then the swap. Get through 10 minutes."], ["Итог: что сработало? Добавь +1 повтор или
