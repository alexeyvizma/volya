<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Воля</title>
<style>
:root{--bg:#f2f2f7;--card:#fff;--tx:#1d1d1f;--sub:#6e6e73;--bl:#0071e3;--chip:#e8e8ed;--ln:rgba(60,60,67,.14);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--card:#1c1c1e;--tx:#f5f5f7;--sub:#98989d;--bl:#2997ff;--chip:#2c2c2e;--ln:rgba(255,255,255,.14)}}
:root[data-theme="dark"]{--bg:#000;--card:#1c1c1e;--tx:#f5f5f7;--sub:#98989d;--bl:#2997ff;--chip:#2c2c2e;--ln:rgba(255,255,255,.14)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
main{max-width:560px;margin:0 auto;padding:20px 18px 120px}
h1{font-size:44px;line-height:1.05;letter-spacing:-.03em;font-weight:700;margin:0 0 14px}
h2{font-size:28px;letter-spacing:-.02em;margin:0 0 8px}
h3{font-size:17px;margin:0 0 4px}
p{line-height:1.45;color:var(--sub);margin:0 0 14px;font-size:17px}
.card{background:var(--card);border-radius:22px;padding:18px;margin:0 0 14px}
.hero{position:relative;overflow:hidden;border-radius:30px;padding:38px 24px 28px;margin-bottom:16px;background:var(--card)}
.blob{position:absolute;width:260px;height:260px;border-radius:50%;filter:blur(60px);opacity:.45;animation:fl 9s ease-in-out infinite alternate}
.b1{background:#5ac8fa;top:-80px;right:-60px}.b2{background:#af52de;bottom:-100px;left:-60px;animation-delay:-4s}
@keyframes fl{to{transform:translate(30px,40px) scale(1.15)}}
.hero>*:not(.blob){position:relative}
.btn{display:block;width:100%;border:0;border-radius:16px;background:var(--bl);color:#fff;font:600 17px inherit;font-family:inherit;padding:16px;cursor:pointer;transition:transform .25s cubic-bezier(.34,1.56,.64,1),opacity .2s}
.btn:active{transform:scale(.96)}.btn[disabled]{opacity:.35}
.btn.g{background:var(--chip);color:var(--bl)}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0 22px}
.chip{border:0;background:var(--card);color:var(--tx);font:500 16px inherit;font-family:inherit;padding:12px 16px;border-radius:999px;cursor:pointer;transition:transform .3s cubic-bezier(.34,1.56,.64,1),background .2s,color .2s}
.chip:active{transform:scale(.94)}.chip.on{background:var(--bl);color:#fff;transform:scale(1.04)}
.bar{height:4px;background:var(--chip);border-radius:4px;margin:6px 0 26px;overflow:hidden}.bar i{display:block;height:100%;background:var(--bl);border-radius:4px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.step{animation:in .5s cubic-bezier(.2,.8,.2,1)}
@keyframes in{from{opacity:0;transform:translateY(18px)}}
.row{display:flex;gap:14px;align-items:center;cursor:pointer;transition:transform .25s}.row:active{transform:scale(.97)}
.ic{font-size:30px;width:50px;height:50px;border-radius:14px;background:var(--chip);display:grid;place-items:center;flex:none}
.row p{margin:0;font-size:14px}
input[type=range]{width:100%;accent-color:var(--bl);margin:10px 0}
textarea,input[type=text]{width:100%;border:0;background:var(--chip);color:var(--tx);border-radius:14px;padding:14px;font:16px inherit;font-family:inherit;margin:0 0 10px}
.tab{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:saturate(180%) blur(22px);-webkit-backdrop-filter:saturate(180%) blur(22px);border-top:.5px solid var(--ln);z-index:5}
.tab button{background:none;border:0;color:var(--sub);font:500 11px inherit;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 18px;cursor:pointer}
.tab button span{font-size:22px}.tab button.on{color:var(--bl)}
#sh{position:fixed;inset:0;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .35s;z-index:10}
#sh.o{opacity:1;pointer-events:auto}
#sc{position:absolute;left:0;right:0;bottom:0;max-height:88%;overflow:auto;background:var(--bg);border-radius:28px 28px 0 0;padding:22px 18px calc(30px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .5s cubic-bezier(.2,.9,.25,1)}
#sh.o #sc{transform:none}
.orb{width:170px;height:170px;border-radius:50%;margin:18px auto;background:radial-gradient(circle at 35% 30%,#7fd6ff,var(--bl));display:grid;place-items:center;color:#fff;font-weight:600;font-size:20px;animation:br 10s ease-in-out infinite;animation-play-state:paused}
.orb.run{animation-play-state:running}
@keyframes br{0%,100%{transform:scale(.7)}40%{transform:scale(1.05)}}
.big{font-size:48px;font-weight:700;text-align:center;margin-bottom:14px;font-variant-numeric:tabular-nums}
.ck{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:.5px solid var(--ln);line-height:1.4;cursor:pointer}
.ck b{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--ln);display:grid;place-items:center;color:#fff;font-size:14px;transition:.3s}
.ck.on b{background:var(--bl);border-color:var(--bl)}
.small{font-size:13px;color:var(--sub);line-height:1.4}
.src{font-size:12px;color:var(--sub);margin-top:12px}
.step>.card,.step>h2{animation:in .6s cubic-bezier(.2,.8,.2,1) backwards}
.step>:nth-child(2){animation-delay:.06s}.step>:nth-child(3){animation-delay:.12s}.step>:nth-child(4){animation-delay:.18s}.step>:nth-child(5){animation-delay:.24s}.step>:nth-child(6){animation-delay:.3s}.step>:nth-child(7){animation-delay:.36s}.step>:nth-child(n+8){animation-delay:.42s}
.bar.rb i{animation:grow 1s cubic-bezier(.2,.8,.2,1)}@keyframes grow{from{width:0}}
.ring{width:190px;height:190px;margin:6px auto 14px;position:relative}.ring svg{transform:rotate(-90deg)}.ring circle{fill:none;stroke-width:12;stroke-linecap:round}.ring .t{stroke:var(--chip)}.ring .p{stroke:var(--bl);transition:stroke-dashoffset 1.6s cubic-bezier(.2,.8,.2,1)}.ring div{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.sos{background:linear-gradient(135deg,#ff453a,#ff9f0a);box-shadow:0 0 0 0 rgba(255,69,58,.5);animation:pulse 2.4s infinite}.sos h3,.sos p{color:#fff}@keyframes pulse{70%{box-shadow:0 0 0 14px rgba(255,69,58,0)}100%{box-shadow:0 0 0 0 rgba(255,69,58,0)}}
input[type=date]{width:100%;border:0;background:var(--chip);color:var(--tx);border-radius:14px;padding:12px;font:16px inherit;font-family:inherit;margin:0 0 10px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main id="app"></main>
<nav class="tab">
<button data-t="home" class="on"><span>◐</span>Анкета</button>
<button data-t="tools"><span>✦</span>Инструменты</button>
<button data-t="about"><span>★</span>Автор</button>
<button data-t="talk"><span>✉︎</span>Связь</button>
</nav>
<div id="sh"><div id="sc"></div></div>
<script>
const TG='https://t.me/alexeyvizma';
const PAT='https://www.patreon.com/alexeyvizma/posts/sila-voli-165919751';
const Q=[
{k:'what',t:'Что сейчас сложнее всего контролировать?',m:1,o:['Телефон и соцсети','Одиночество','Переедание','Сигареты и вейп','Алкоголь','Наркотики','Другое']},
{k:'freq',t:'Как часто бывают срывы?',o:['Каждый день','Несколько раз в неделю','Раз в месяц или реже','Пока не понимаю']},
{k:'trg',t:'Когда накрывает сильнее всего?',m:1,o:['Скука','Стресс','Усталость','Одиночество','Компания','После ссоры','Вечером','Утром']},
{k:'env',t:'Где это обычно происходит?',o:['Дома один','Дома с близкими','На работе','В компании друзей','Везде']},
{k:'chg',t:'Эту среду можно изменить?',s:'Честный ответ — часть плана.',o:['Да, могу','Частично','Нет, вынужден быть там','Не знаю']},
{k:'will',t:'Насколько ты готов меняться?',range:1}
];
let A={},st=0,tab='home',ifs=(()=>{try{return JSON.parse(localStorage.getItem('volya_if')||'[]')}catch(e){return[]}})(),tmr=null;
const $=s=>document.querySelector(s),app=$('#app');
const T={
wave:{n:'Волна желания',i:'🌊',s:'Метод urge surfing, Marlatt',h:()=>`<p>Желание похоже на волну: нарастает, достигает пика и спадает — обычно за 10–20 минут. Не борись с ним, наблюдай.</p><div class="orb" id="orb"><span id="bt">Готов?</span></div><div class="big" id="tm">10:00</div><button class="btn" id="go">Начать 10 минут</button><p class="src">Основа: Marlatt & Gordon, профилактика рецидивов; mindfulness-based relapse prevention.</p>`,
 f:()=>{$('#go').onclick=()=>{let r=600;$('#orb').classList.add('run');$('#go').disabled=true;clearInterval(tmr);tmr=setInterval(()=>{r--;$('#tm').textContent=Math.floor(r/60)+':'+String(r%60).padStart(2,'0');$('#bt').textContent=(600-r)%10<4?'Вдох':'Выдох';if(r<=0){clearInterval(tmr);$('#bt').textContent='Волна прошла';$('#orb').classList.remove('run')}},1000)}}},
halt:{n:'Проверка HALT',i:'🔎',s:'Голод, злость, одиночество, усталость',h:()=>`<p>Часто тянет не к веществу, а к тому, чего не хватает. Отметь, что есть сейчас.</p>${['Голоден','Злюсь','Одиноко','Устал'].map((x,i)=>`<div class="ck" data-h="${i}"><b>✓</b>${x}</div>`).join('')}<div class="card" id="hr" style="margin-top:14px">Отметь пункты — я подскажу первый шаг.</div>`,
 f:()=>{const adv=['Поешь: белок и вода, 15 минут.','Выпусти злость телом: 20 приседаний или быстрая ходьба.','Напиши или позвони одному человеку. Хватит одного сообщения.','Отдых 20 минут: лечь, без экрана. Решения вечером хуже.'];document.querySelectorAll('[data-h]').forEach(e=>e.onclick=()=>{e.classList.toggle('on');const l=[...document.querySelectorAll('[data-h].on')].map(x=>adv[x.dataset.h]);$('#hr').innerHTML=l.length?l.join('<br><br>'):'Отметь пункты — я подскажу первый шаг.'})}},
ifthen:{n:'План «Если — то»',i:'🧭',s:'Implementation intentions, Gollwitzer',h:()=>`<p>Заранее решённая реакция срабатывает без борьбы силой воли. Формула: «Если случится X, то я сделаю Y».</p><input type="text" id="i1" placeholder="Если я приду домой и захочу закурить…"><input type="text" id="i2" placeholder="…то выпью воды и выйду на 10 минут"><button class="btn" id="ad">Добавить план</button><div id="ls" style="margin-top:14px"></div><p class="src">Meta-analysis: Gollwitzer & Sheeran, 2006 — планы «если—то» заметно повышают достижение целей.</p>`,
 f:()=>{const d=()=>$('#ls').innerHTML=ifs.map(x=>`<div class="card">${x}</div>`).join('');d();$('#ad').onclick=()=>{const a=$('#i1').value.trim(),b=$('#i2').value.trim();if(a&&b){ifs.push(a.replace(/…$/,'')+', '+b.replace(/^…/,''));try{localStorage.setItem('volya_if',JSON.stringify(ifs))}catch(e){}$('#i1').value=$('#i2').value='';d()}}}},
ground:{n:'Заземление 5-4-3-2-1',i:'🌿',s:'Быстро снизить тревогу',h:()=>`<p>Помогает при панике и сильном импульсе. Отмечай по мере выполнения.</p>${['5 вещей, которые вижу','4 вещи, которых могу коснуться','3 звука, которые слышу','2 запаха','1 вкус во рту'].map(x=>`<div class="ck"><b>✓</b>${x}</div>`).join('')}<p class="src">Техника из КПТ для регуляции тревоги и внимания.</p>`,f:()=>{document.querySelectorAll('.ck').forEach(e=>e.onclick=()=>e.classList.toggle('on'))}},
env:{n:'Перестройка среды',i:'🏠',s:'Трение и сигналы среды',h:()=>`<p>Среда запускает привычку чаще, чем характер. Меняй то, что можно изменить.</p>${['Убрать триггер с глаз: спрятать, удалить, не покупать','Добавить трение: чтобы дотянуться, нужно 20+ секунд','Сменить маршрут или место, где обычно срываешься','Найти союзника и сказать ему о цели','Если уйти нельзя — составить план «Если — то» на это место'].map(x=>`<div class="ck"><b>✓</b>${x}</div>`).join('')}<p class="src">Wood & Neal, 2007: привычки в большой степени управляются контекстом.</p>`,f:()=>{document.querySelectorAll('.ck').forEach(e=>e.onclick=()=>e.classList.toggle('on'))}},
anti:{n:'Антизависимость',i:'🛡️',s:'Дни свободы и калькулятор экономии',h:()=>`<p>Отмечай, с какого дня держишься, и смотри, сколько дней и денег уже сохранено.</p><div id='an'></div><input type='text' id='what' placeholder='От чего освобождаешься? Например, сигареты'><input type='text' id='cost' inputmode='decimal' placeholder='Сколько тратил в день, €'><input type='date' id='sd'><button class='btn' id='sv'>Сохранить</button><button class='btn g' id='rs' style='margin-top:10px'>Начать отсчёт с сегодня</button><p class='src'>Срыв — не конец пути: просто начни отсчёт снова. Данные хранятся только на твоём телефоне.</p>`,f:()=>{const K='volya_anti',MS=[1,3,7,14,30,60,90,180,365];let d={};try{d=JSON.parse(localStorage.getItem(K)||'{}')}catch(e){}
const draw=()=>{const b=$('#an');if(!d.start){b.innerHTML=`<div class='card'>Укажи дату начала и сколько тратил в день, и я покажу прогресс.</div>`;return}
const days=Math.max(0,Math.floor((Date.now()-new Date(d.start+'T00:00:00'))/864e5)),nx=MS.find(m=>m>days)||days+1,pv=MS.filter(m=>m<=days).pop()||0,C=2*Math.PI*80,money=Math.round(days*(parseFloat(d.cost)||0));
b.innerHTML=`<div class='ring'><svg width='190' height='190' viewBox='0 0 190 190'><circle class='t' cx='95' cy='95' r='80'/><circle class='p' id='pr' cx='95' cy='95' r='80' stroke-dasharray='${C}' stroke-dashoffset='${C}'/></svg><div><b style='font-size:46px' id='dn'>0</b><span class='small'>${d.what?'дней без: '+d.what:'дней'}</span></div></div><div class='card' style='text-align:center'><h2 id='mn' style='margin:0'>0 €</h2><p class='small' style='margin:4px 0 0'>сохранено. До отметки в ${nx} дн. осталось ${nx-days}</p></div>`;
requestAnimationFrame(()=>requestAnimationFrame(()=>{$('#pr').style.strokeDashoffset=C*(1-(days-pv)/(nx-pv));cu($('#dn'),days,'');cu($('#mn'),money,' €')}))};
$('#what').value=d.what||'';$('#cost').value=d.cost||'';$('#sd').value=d.start||'';
const sv=()=>{d={start:$('#sd').value||d.start,cost:$('#cost').value.replace(',','.'),what:$('#what').value.trim()};try{localStorage.setItem(K,JSON.stringify(d))}catch(e){}draw()};
$('#sv').onclick=sv;$('#rs').onclick=()=>{$('#sd').value=new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);sv()};draw()}},
swap:{n:'Замена привычки',i:'🔁',s:'Бросить нельзя, можно заменить',h:()=>`<p>Привычка решает задачу: гасит стресс, скуку или напряжение. Одним запретом задача не исчезает. Найди её и дай другой способ.</p><h3>Что привычка делает для тебя?</h3><div class="chips" id="fn">${['Гасит стресс','Спасает от скуки','Снимает напряжение','Заглушает одиночество','Награда после дня'].map(x=>`<button class="chip">${x}</button>`).join('')}</div><div class="card" id="sw">Выбери функцию, и я предложу замену.</div><p class="src">Основа: habit reversal training (Azrin & Nunn, 1973), замена конкурирующим действием.</p>`,f:()=>{const m={'Гасит стресс':'Медленный выдох 4–6 на 2 минуты, затем 5 минут быстрой ходьбы.','Спасает от скуки':'Заранее подготовь 3 дела на 10 минут: звонок, короткая тренировка, музыка.','Снимает напряжение':'Растяжка шеи и плеч 3 минуты или поочерёдное напряжение и расслабление мышц.','Заглушает одиночество':'Одно сообщение живому человеку прямо сейчас. Хватит одного.','Награда после дня':'Новая награда в то же время и в том же месте: горячий душ, чай, любимый трек.'};document.querySelectorAll('#fn .chip').forEach(c=>c.onclick=()=>{document.querySelectorAll('#fn .chip').forEach(x=>x.classList.toggle('on',x===c));$('#sw').innerHTML=m[c.textContent]})}},
phone:{n:'Детокс от телефона',i:'📵',s:'Универсальный первый шаг',h:()=>`<p>Пять шагов, которые можно сделать за 5 минут.</p>${['Чёрно-белый экран: Настройки → Универсальный доступ','Убрать соцсети с главного экрана','Отключить все уведомления, кроме звонков','Ночью телефон заряжается вне спальни','Лимит приложений: 30 минут в день для самого затягивающего'].map(x=>`<div class="ck"><b>✓</b>${x}</div>`).join('')}<p class="src">Исследования показывают, что даже присутствие телефона на столе снижает концентрацию (Ward et al., 2017).</p>`,f:()=>{document.querySelectorAll('.ck').forEach(e=>e.onclick=()=>e.classList.toggle('on'))}}
};
function cu(el,to,suf){let s=null;const f=t=>{s=s||t;const p=Math.min(1,(t-s)/1200);el.textContent=Math.round(to*(1-Math.pow(1-p,3)))+(suf||'');if(p<1)requestAnimationFrame(f)};requestAnimationFrame(f)}
function open_(k){clearInterval(tmr);const t=T[k];$('#sc').innerHTML=`<h2>${t.n}</h2>${t.h()}<button class="btn g" onclick="cl()" style="margin-top:12px">Закрыть</button>`;$('#sh').classList.add('o');t.f&&t.f()}
function cl(){clearInterval(tmr);$('#sh').classList.remove('o')}
$('#sh').onclick=e=>{if(e.target.id==='sh')cl()};
function home(){app.innerHTML=`<div class="hero step"><div class="blob b1"></div><div class="blob b2"></div><h1>Воля</h1><p style="color:var(--tx);font-size:21px">Ты взял телефон раньше, чем дочитал эту строку?</p><p>Это нормально. Мы все немного зависимы от экрана. Пройди 2 минуты анкеты и получи личный разбор и инструменты. Анонимно: ответы остаются на твоём телефоне.</p><button class="btn" onclick="st=0;A={};quiz()">Начать</button></div><div class="card sos row" onclick="open_('wave')"><div class="ic" style="background:rgba(255,255,255,.25)">🆘</div><div><h3>Тянет прямо сейчас?</h3><p>10 минут, и волна пройдёт. Нажми.</p></div></div><div class="card"><h3>Бросить невозможно. Заменить можно.</h3><p style="margin:0">Привычка решает твою задачу: гасит стресс, скуку, напряжение. Мы находим эту задачу и даём другое действие с меньшим вредом. Без советов «соберись».</p></div>`}
function quiz(){const q=Q[st];let h=`<div class="step"><div class="bar"><i style="width:${(st+1)/Q.length*100}%"></i></div><h2>${q.t}</h2>${q.s?`<p>${q.s}</p>`:''}`;
if(q.range){h+=`<p id="rv" style="font-size:34px;font-weight:700;color:var(--bl);margin:6px 0 0">${A.will??5} из 10</p><input type="range" min="0" max="10" value="${A.will??5}" oninput="A.will=+this.value;$('#rv').textContent=this.value+' из 10'"><textarea id="nt" rows="3" placeholder="Что ещё тебя волнует? (необязательно)"></textarea><button class="btn" onclick="A.will=A.will??5;A.note=$('#nt').value;res()">Показать мой разбор</button>`}
else{h+=`<div class="chips">${q.o.map(o=>`<button class="chip ${(A[q.k]||[]).includes(o)?'on':''}" onclick="pick('${q.k}','${o}',${q.m?1:0},this)">${o}</button>`).join('')}</div><button class="btn" id="nx" ${A[q.k]?.length?'':'disabled'} onclick="st++;quiz()">Далее</button>`}
app.innerHTML=h+'</div>';scrollTo(0,0)}
function pick(k,o,m,el){A[k]=A[k]||[];if(m){const i=A[k].indexOf(o);i>-1?A[k].splice(i,1):A[k].push(o)}else A[k]=[o];el.parentNode.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',A[k].includes(c.textContent)));$('#nx').disabled=!A[k].length}
function res(){const w=A.what||[],g=A.trg||[],c=(A.chg||[])[0]||'';let rec=['env'];
if(w.some(x=>x.startsWith('Телефон')))rec.unshift('phone');
if(g.some(x=>['Скука','Одиночество'].includes(x)))rec.unshift('wave');
if(g.some(x=>['Стресс','Усталость','После ссоры'].includes(x)))rec.unshift('ground','halt');
rec.push('ifthen','wave');rec=[...new Set(rec)].slice(0,3);rec.push('swap','anti');rec=[...new Set(rec)];
const envT=c.startsWith('Да')?'Среду можно менять — это самый сильный рычаг. Начни с того, что убрать триггеры из поля зрения.':c.startsWith('Частично')?'Часть среды ты контролируешь. Измени её, а для остального нужны планы «Если — то».':c.startsWith('Нет')?'Ты вынужден быть там — значит, упор на заранее заготовленные реакции и поддержку людей рядом.':'Присмотрись неделю, где и когда это происходит: записывай места и время.';
const hv=['Каждый день','Несколько раз в неделю'].includes((A.freq||[])[0]);
app.innerHTML=`<div class="step"><h1 style="font-size:36px">Твой разбор</h1><div class="card"><h3>Что сложно сейчас</h3><p style="margin:0">${w.join(', ')||'—'}. Триггеры: ${g.join(', ')||'—'}.</p></div><div class="card"><h3>Среда</h3><p style="margin:0">${envT}</p></div><div class="card"><h3>Готовность: ${A.will} из 10</h3><div class="bar rb" style="margin:10px 0 12px"><i style="width:${A.will*10}%"></i></div><p style="margin:0">${A.will>=7?'Хороший настрой. Начни с одного маленького шага сегодня.':A.will>=4?'Колебания — часть пути. Выбери самый лёгкий инструмент.':'Не торопись. Достаточно начать с наблюдения и одной техники.'}</p></div><h2 style="margin-top:22px">Начни с этого</h2>${rec.map(k=>row(k)).join('')}${hv&&w.some(x=>['Алкоголь','Наркотики'].includes(x))?`<div class="card"><p class="small" style="margin:0">При частом употреблении алкоголя или наркотиков резкий отказ может быть опасен. Посоветуйся с врачом.</p></div>`:''}${tgCard()}</div>`;scrollTo(0,0)}
const row=k=>`<div class="card row" onclick="open_('${k}')"><div class="ic">${T[k].i}</div><div><h3>${T[k].n}</h3><p>${T[k].s}</p></div></div>`;
const tgCard=()=>`<div class="card" style="margin-top:18px"><h3>Хочешь разобрать результат вместе?</h3><p>Напиши в Telegram — отвечу лично. Ничего не продаю и никуда не зову, просто поговорим.</p><button class="btn g" onclick="window.open('${TG}','_blank')">Написать в Telegram</button></div>`;
function tools(){app.innerHTML=`<div class="step"><h1 style="font-size:36px">Инструменты</h1><div class="card sos row" onclick="open_('wave')"><div class="ic" style="background:rgba(255,255,255,.25)">🆘</div><div><h3>Тянет прямо сейчас?</h3><p>Волна желания: 10 минут</p></div></div>${['anti',...Object.keys(T).filter(k=>k!=='anti')].map(row).join('')}</div>`}
function talk(){app.innerHTML=`<h1 style="font-size:36px" class="step">Связь</h1><p>Приложение сделано, чтобы помочь увидеть свою ситуацию и дать рабочие инструменты. Это не лечение и не замена врачу.</p>${tgCard()}<div class="card"><h3>Когда нужна срочная помощь</h3><p style="margin:0">Если есть мысли о самоповреждении, угроза жизни или тяжёлое состояние после отказа от алкоголя или веществ — звони в скорую (112) или обратись к врачу.</p></div>`}
function about(){app.innerHTML=`<div class="step"><h1 style="font-size:36px">Сила Воли</h1><div class="hero" style="padding:28px 22px"><div class="blob b1"></div><p style="color:var(--tx);font-size:26px;font-weight:700;line-height:1.15;letter-spacing:-.02em;margin:0 0 10px">15 лет зависимостей → 6 лет свободы.</p><p style="margin:0">Я помогаю разобраться в механизме зависимости, работать с тягой и заменять разрушительные привычки действиями, которые работают на тебя.</p></div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px">${[['100+','человек переписали сценарий'],['3','сессии до понимания срыва'],['100%','анонимность']].map(s=>`<div class="card" style="margin:0;padding:14px;text-align:center"><div style="font-size:26px;font-weight:700;color:var(--bl)">${s[0]}</div><div class="small">${s[1]}</div></div>`).join('')}</div><div class="card"><h3>Знакомый сценарий?</h3><p style="margin:0">Обещаешь, что это в последний раз → держишься первые дни → приходит стресс, скука или усталость → срыв → злость на себя → новое обещание.</p></div><div class="card"><h3>Почему это повторяется</h3><p style="margin:0">Одного желания измениться мало. Пока непонятно, что запускает привычку и какую задачу она решает, сценарий возвращается.</p></div><div class="card"><h3>Программа «Сила Воли»</h3><p>Разбираем механизм срыва и ищем замену. Анонимно.</p><button class="btn" onclick="window.open(PAT,'_blank')">Смотреть программу</button></div><p style="text-align:center;font-size:20px;color:var(--tx);font-weight:600">«Если не сейчас — то когда?»</p>${tgCard()}</div>`;}
const V={home:()=>{home()},tools,about,talk};
document.querySelectorAll('.tab button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;document.querySelectorAll('.tab button').forEach(x=>x.classList.toggle('on',x===b));V[tab]();scrollTo(0,0)});
home();
</script>
